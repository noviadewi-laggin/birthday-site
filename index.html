<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ade❤️</title>

  <style>
    body{
      margin:0;
      background:black;
      text-align:center;
    }

    img{
      width:100%;
      display:block;
    }

    .start{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-image:url('cover.png');
  background-size:cover;
  background-position:center;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  z-index:999;
  cursor:pointer;
}

.overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.45);
}

.cover-text{
  position:relative;
  color:white;
  text-align:center;
  font-family:Georgia, serif;
  font-size:32px;
  line-height:1.5;
  text-shadow:0 0 15px rgba(0,0,0,0.8);
}

.love{
  margin-top:30px;
  font-size:18px;
  opacity:0.9;
}
    #slide{
  width:100%;
  height:100vh;
  object-fit:contain;
  background:black;
}

.nav{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:20px;
}

button{
  padding:10px 20px;
  font-size:20px;
  border:none;
  border-radius:10px;
}
  </style>
</head>

<body>

<div class="start" onclick="playMusic()">

  <div class="overlay"></div>

  <div class="cover-text">
    tap to open<br>
    your b’day letter sayang! 🎧

    <div class="love">
      with love,<br>
      Novia
    </div>
  </div>

</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<img id="slide" src="1.png">

<div class="nav">
  <button onclick="prevSlide()">←</button>
  <button onclick="nextSlide()">→</button>
</div>
  
<script>
let currentSlide = 1;
const totalSlides = 9;

function playMusic() {
  document.getElementById("music").play();
  document.querySelector(".start").style.display = "none";
}

function nextSlide() {
  if (currentSlide < totalSlides) {
    currentSlide++;
    document.getElementById("slide").src = currentSlide + ".png";
  }
}

function prevSlide() {
  if (currentSlide > 1) {
    currentSlide--;
    document.getElementById("slide").src = currentSlide + ".png";
  }
}
</script>

</body>
</html>

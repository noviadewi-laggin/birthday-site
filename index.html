<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday Ade❤️</title>

  <style>
    body{
      margin:0;
      background:black;
      text-align:center;
    }

    img{
      width:100%;
      display:block;
    }

    .start{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:black;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:30px;
      z-index:999;
      cursor:pointer;
      font-family:Arial;
    }
    #slide{
  width:100%;
  height:100vh;
  object-fit:contain;
  background:black;
}

.nav{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:20px;
}

button{
  padding:10px 20px;
  font-size:20px;
  border:none;
  border-radius:10px;
}
  </style>
</head>

<body>

<div class="start" onclick="playMusic()">
  tap to open your b'day letter sayang! 🎧
  <br><br>
  with love, Novia ❤️
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<img id="slide" src="1.png">

<div class="nav">
  <button onclick="prevSlide()">←</button>
  <button onclick="nextSlide()">→</button>
</div>
  
<script>
let currentSlide = 1;
const totalSlides = 8;

function playMusic() {
  document.getElementById("music").play();
  document.querySelector(".start").style.display = "none";
}

function nextSlide() {
  if (currentSlide < totalSlides) {
    currentSlide++;
    document.getElementById("slide").src = currentSlide + ".png";
  }
}

function prevSlide() {
  if (currentSlide > 1) {
    currentSlide--;
    document.getElementById("slide").src = currentSlide + ".png";
  }
}
</script>

</body>
</html>

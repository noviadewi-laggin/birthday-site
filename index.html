<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ade ❤️</title>

  <style>

    body{
      margin:0;
      background:black;
      overflow-x:hidden;
      font-family:Georgia, serif;
    }

    .start{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background-image:url('cover.png');
      background-size:cover;
      background-position:center;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      z-index:999;
      cursor:pointer;
      transition:opacity 1s ease;
    }

    .overlay{
      position:absolute;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.45);
    }

    .cover-text{
      position:relative;
      color:white;
      text-align:center;
      font-size:32px;
      line-height:1.5;
      text-shadow:0 0 15px rgba(0,0,0,0.8);
      padding:20px;
    }

    .love{
      margin-top:30px;
      font-size:18px;
      opacity:0.9;
    }

    .container{
      max-width:700px;
      margin:auto;
      padding-top:20px;
      padding-bottom:40px;
    }

    .container img{
      width:100%;
      display:block;
      margin-bottom:40px;
      border-radius:18px;
    }

    @media screen and (max-width:768px){

      .cover-text{
        font-size:24px;
      }

      .love{
        font-size:16px;
      }

      .container{
        max-width:100%;
      }

      .container img{
        margin-bottom:20px;
        border-radius:0;
      }

    }

  </style>
</head>

<body>

<div class="start" onclick="playMusic()">

  <div class="overlay"></div>

  <div class="cover-text">
    tap to open<br>
    your b’day letter sayang 🎧

    <div class="love">
      with love,<br>
      Novia
    </div>

  </div>

</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

  <img src="1.png">
  <img src="2.png">
  <img src="3.png">
  <img src="4.png">
  <img src="5.png">
  <img src="6.png">
  <img src="7.png">
  <img src="8.png">
  <img src="9.png">

</div>

<script>

function playMusic() {

  document.getElementById("music").play();

  const startScreen = document.querySelector(".start");

  startScreen.style.opacity = "0";

  setTimeout(() => {
    startScreen.style.display = "none";
  }, 1000);

}

</script>

</body>
</html>
